# Security updates only: `open-pull-requests-limit: 0` turns version updates off,
# and the groups below bundle each ecosystem's security updates into one pull request.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/example"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
